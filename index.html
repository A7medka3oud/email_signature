<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Email Signature - Gmail Compatible</title>
</head>
<body style="margin:0; padding:0; background:#ffffff; font-family:Arial, Helvetica, sans-serif;">

<!--
  ============================================================
  IMPORTANT: Replace all instances of:
  https://YOURHOST.COM/
  with your actual hosting URL
  Example: https://www.awtarksa.com/signature/
  ============================================================
-->

<!-- Outer wrapper table -->
<table
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="width:600px; max-width:600px; border-collapse:collapse;"
>
  <tr>

    <!-- Main cell: background image set here (Gmail supports background-image inline on td) -->
    <td
      background="https://YOURHOST.COM/background.png"
      style="
        background-image: url('https://YOURHOST.COM/background.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-position: center center;
        width: 600px;
        height: 263px;
        padding: 0;
      "
      width="600"
      height="263"
    >

      <!-- Inner table to split left (logo area) / right (contact info) -->
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="width:100%; height:263px; border-collapse:collapse;"
      >
        <tr>

          <!-- LEFT: empty — this covers the logo area of the background image -->
          <td
            width="55%"
            style="width:55%; height:263px;"
          >&nbsp;</td>

          <!-- RIGHT: contact links — aligned to the bottom of the card -->
          <td
            width="45%"
            valign="bottom"
            style="
              width: 45%;
              height: 263px;
              vertical-align: bottom;
              padding-bottom: 22px;
              padding-right: 10px;
            "
          >

            <!-- Phone / WhatsApp -->
            <a
              href="https://api.whatsapp.com/send?phone=966551237974"
              target="_blank"
              style="
                display: block;
                text-decoration: none;
                color: #9B9B9B;
                font-size: 11px;
                font-weight: 600;
                font-family: Arial, Helvetica, sans-serif;
                margin-bottom: 10px;
                line-height: 1.2;
              "
            >
              <img
                src="https://YOURHOST.COM/phone-icon.png"
                width="13"
                height="13"
                alt="Phone"
                style="vertical-align:middle; margin-right:6px; display:inline-block;"
              ><span style="vertical-align:middle;">+966 551 237 974</span>
            </a>

            <!-- Website -->
            <a
              href="https://www.awtarksa.com/"
              target="_blank"
              style="
                display: block;
                text-decoration: none;
                color: #9B9B9B;
                font-size: 11px;
                font-weight: 600;
                font-family: Arial, Helvetica, sans-serif;
                margin-bottom: 10px;
                line-height: 1.2;
              "
            >
              <img
                src="https://YOURHOST.COM/global-icon.png"
                width="13"
                height="13"
                alt="Website"
                style="vertical-align:middle; margin-right:6px; display:inline-block;"
              ><span style="vertical-align:middle;">www.awtarksa.com</span>
            </a>

            <!-- Location -->
            <a
              href="https://www.google.com/maps/place/RDLC7445,+7445+Hail,+3664%D8%8C+%D8%AD%D9%8A+%D8%B8%D9%87%D8%B1%D8%A9+%D9%84%D8%A8%D9%86%D8%8C+Riyadh+13784,+Saudi+Arabia"
              target="_blank"
              style="
                display: block;
                text-decoration: none;
                color: #9B9B9B;
                font-size: 11px;
                font-weight: 600;
                font-family: Arial, Helvetica, sans-serif;
                line-height: 1.2;
              "
            >
              <img
                src="https://YOURHOST.COM/location-icon.png"
                width="13"
                height="13"
                alt="Location"
                style="vertical-align:middle; margin-right:6px; display:inline-block;"
              ><span style="vertical-align:middle;">RDLC7445, Riyadh, Saudi Arabia</span>
            </a>

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
