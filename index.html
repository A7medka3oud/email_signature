<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Signature – Awtar</title>
</head>

<body style="
margin:0;
padding:20px;
background:url('https://a7medka3oud.github.io/email_signature/background.jpg') no-repeat center center;
background-size:cover;">

<!-- Outer center wrapper -->
<table width="100%"
       cellpadding="0"
       cellspacing="0"
       border="0"
       style="border-collapse:collapse;">

  <tr>

    <td align="center"
        style="padding:0;">

      <!-- ── CARD 600px fixed width ── -->
      <table width="600"
             cellpadding="0"
             cellspacing="0"
             border="0"
             style="
             width:600px;
             border-collapse:collapse;
             background:url('https://a7medka3oud.github.io/email_signature/background.jpg') no-repeat center center;
             background-size:cover;
             font-family:Arial,sans-serif;">

        <!-- Top padding row -->
        <tr>
          <td colspan="3"
              height="24"
              style="
              height:24px;
              font-size:0;
              line-height:0;">
            &nbsp;
          </td>
        </tr>

        <!-- ── MAIN ROW ── -->
        <tr>

          <!-- ── LEFT: Logo cell ── -->
          <td width="210"
              align="center"
              valign="middle"
              style="
              width:220px;
              padding:5px 5px 5px 15px;
              vertical-align:middle;">

            <img src="https://a7medka3oud.github.io/email_signature/logo.png"
                 width="180"
                 height="180"
                 alt="Awtar Logo"
                 style="
                 display:block;
                 border:0;
                 max-width:140px;" />

          </td>

          <!-- Divider -->
          <td width="1"
              bgcolor="#c7992c"
              style="
              width:1px;
              background-color:#c7992c;
              padding:0;
              font-size:0;
              line-height:0;">
            &nbsp;
          </td>

          <!-- ── RIGHT: Info cell ── -->
          <td valign="middle"
              style="
              vertical-align:middle;
              padding:8px 22px 8px 22px;">

            <!-- Name English -->
            <p style="
                      margin:0;
                      padding:0;
                      font-size:20px;
                      font-weight:700;
                      line-height:1.2;
                      color:#989998;
                      font-family:Georgia,'Times New Roman',serif;
                      letter-spacing:0.02em;">

              Mahmood Al Dawod

            </p>

            <!-- Title English -->
            <p style="
                      margin:4px 0 0 0;
                      padding:0;
                      font-size:11px;
                      font-weight:700;
                      color:#c7992c;
                      font-family:Arial,sans-serif;
                      letter-spacing:0.06em;
                      text-transform:uppercase;">

              Group General Manager

            </p>

            <!-- Vertical space -->
            <p style="
            margin:0;
            padding:0;
            font-size:8px;
            line-height:10px;">
            &nbsp;
            </p>

            <!-- Name Arabic -->
            <p style="
                      margin:0;
                      padding:0;
                      font-size:17px;
                      font-weight:700;
                      line-height:1.3;
                      color:#989998;
                      font-family:'Segoe UI',Tahoma,Arial,sans-serif;
                      direction:rtl;
                      text-align:left;">

              محمود الداود

            </p>

            <!-- Title Arabic -->
            <p style="
                      margin:3px 0 0 0;
                      padding:0;
                      font-size:11px;
                      font-weight:700;
                      color:#c7992c;
                      font-family:'Segoe UI',Tahoma,Arial,sans-serif;
                      direction:rtl;
                      text-align:left;">

              مدير عام المجموعة

            </p>

            <!-- Vertical space -->
            <p style="
            margin:0;
            padding:0;
            font-size:10px;
            line-height:14px;">
            &nbsp;
            </p>

            <!-- Contact rows -->
            <table cellpadding="0"
                   cellspacing="0"
                   border="0"
                   style="border-collapse:collapse;">

              <!-- Phone -->
              <tr>

                <td width="30"
                    valign="middle"
                    style="
                    width:30px;
                    padding:0 0 8px 0;
                    vertical-align:middle;">

                  <img src="https://a7medka3oud.github.io/email_signature/phone-icon.png"
                       width="18"
                       height="18"
                       alt="Phone"
                       style="
                       display:block;
                       border:0;" />

                </td>

                <td valign="middle"
                    style="
                    padding:0 0 8px 0;
                    vertical-align:middle;">

                  <a href="https://api.whatsapp.com/send?phone=966551237974"
                     target="_blank"
                     style="
                            text-decoration:none;
                            color:#989998;
                            font-size:12px;
                            font-weight:600;
                            font-family:Arial,sans-serif;
                            white-space:nowrap;">

                    +966 551 237 974

                  </a>

                </td>

              </tr>

              <!-- Website -->
              <tr>

                <td width="30"
                    valign="middle"
                    style="
                    width:30px;
                    padding:0 0 8px 0;
                    vertical-align:middle;">

                  <img src="https://a7medka3oud.github.io/email_signature/global-icon.png"
                       width="18"
                       height="18"
                       alt="Website"
                       style="
                       display:block;
                       border:0;" />

                </td>

                <td valign="middle"
                    style="
                    padding:0 0 8px 0;
                    vertical-align:middle;">

                  <a href="https://www.awtarksa.com/"
                     target="_blank"
                     style="
                            text-decoration:none;
                            color:#989998;
                            font-size:12px;
                            font-weight:600;
                            font-family:Arial,sans-serif;
                            white-space:nowrap;">

                    www.awtarksa.com

                  </a>

                </td>

              </tr>

              <!-- Location -->
              <tr>

                <td width="30"
                    valign="middle"
                    style="
                    width:30px;
                    padding:0;
                    vertical-align:middle;">

                  <img src="https://a7medka3oud.github.io/email_signature/location-icon.png"
                       width="18"
                       height="18"
                       alt="Location"
                       style="
                       display:block;
                       border:0;" />

                </td>

                <td valign="middle"
                    style="
                    padding:0;
                    vertical-align:middle;">

                  <a href="https://www.google.com/maps/place/RDLC7445,+7445+Hail,+3664,+Riyadh+13784,+Saudi+Arabia"
                     target="_blank"
                     style="
                            text-decoration:none;
                            color:#989998;
                            font-size:12px;
                            font-weight:600;
                            font-family:Arial,sans-serif;
                            white-space:nowrap;">

                    RDLC7445, Riyadh, Saudi Arabia

                  </a>

                </td>

              </tr>

            </table>

          </td>

        </tr>

        <!-- Bottom padding -->
        <tr>

          <td colspan="3"
              height="24"
              style="
              height:24px;
              font-size:0;
              line-height:0;">

            &nbsp;

          </td>

        </tr>

      </table>

    </td>

  </tr>

</table>

</body>
</html>
