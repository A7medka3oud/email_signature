<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Email Signature</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  .sig-wrapper {
    position: relative;
    width: 600px;
    font-family: Arial, Helvetica, sans-serif;
  }

  .sig-wrapper img.bg {
    width: 600px;
    height: auto;
    display: block;
  }

  /* ─── تعديل موضع الكونتاكت من هنا ─── */
  .sig-wrapper .info {
    position: absolute;
    left: 44%;       /* تحريك يمين/يسار */
    top: 63%;        /* تحريك أعلى/أسفل */
    width: 52%;
  }

  .sig-wrapper .info a {
    display: flex;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    color: #9B9B9B;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 9px;
    line-height: 1;
    white-space: nowrap;
  }

  .sig-wrapper .info a img {
    width: 13px;
    height: 13px;
    display: inline-block;
    flex-shrink: 0;
  }
</style>
</head>
<body style="margin:0; padding:0; background:#ffffff;">

<div class="sig-wrapper">

  <img
    class="bg"
    src="https://a7medka3oud.github.io/email_signature/background.png"
    alt="Signature Background"
  >

  <div class="info">

    <a href="https://api.whatsapp.com/send?phone=966551237974" target="_blank">
      <img src="https://a7medka3oud.github.io/email_signature/phone-icon.png" alt="Phone">
      <span>+966 551 237 974</span>
    </a>

    <a href="https://www.awtarksa.com/" target="_blank">
      <img src="https://a7medka3oud.github.io/email_signature/global-icon.png" alt="Website">
      <span>www.awtarksa.com</span>
    </a>

    <a href="https://www.google.com/maps/place/RDLC7445,+7445+Hail,+3664%D8%8C+%D8%AD%D9%8A+%D8%B8%D9%87%D8%B1%D8%A9+%D9%84%D8%A8%D9%86%D8%8C+Riyadh+13784,+Saudi+Arabia" target="_blank">
      <img src="https://a7medka3oud.github.io/email_signature/location-icon.png" alt="Location">
      <span>RDLC7445, Riyadh, Saudi Arabia</span>
    </a>

  </div>
</div>

</body>
</html>
