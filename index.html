<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<title>Signature Preview – AWTAR</title>

</head>
<body>

<div class="wrap">
<div dir="ltr">

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║         AWTAR – EMAIL SIGNATURE  /  إعدادات السيجنيتشر      ║
  ╚══════════════════════════════════════════════════════════════╝
  الصور:
    01.png  ← طبقة الأوراق
    02.png  ← الإطار الذهبي
    04.png  ← اللوجو
-->

<!-- ══════════════════════════════════════════════════════════
     OUTER TABLE  |  الجدول الخارجي
     ══════════════════════════════════════════════════════════ -->
<table dir="ltr" cellpadding="0" cellspacing="0" border="0"
       width="600" bgcolor="#ffffff"
       style="width:600px;max-width:600px;border-collapse:collapse;
              background-color:#ffffff;background-image:url('https://a7medka3oud.github.io/email_signature/background.jpg');">
  <tr>

    <!-- ╔══════════════════════════════════════════════════════════╗
         ║  MAIN BLOCK  |  البلوك الرئيسي الواحد                  ║
         ║  كل العناصر هنا داخل position:relative                 ║
         ║                                                        ║
         ║  عشان تتحكم في أي عنصر غير:                           ║
         ║    left  = تحريك يمين / يسار                          ║
         ║    top   = تحريك أعلى / أسفل                          ║
         ║    width / height = الحجم                             ║
         ╚══════════════════════════════════════════════════════════╝

         ↓↓  width  = عرض السيجنيتشر الكلي
         ↓↓  height = ارتفاع السيجنيتشر الكلي  -->
    <td width="600" height="200"
        style="width:600px;height:200px;padding:0;margin:0;
               position:relative;overflow:hidden;">


      <!-- ┌──────────────────────────────────────────────────────┐
           │  🍃  طبقة الأوراق  –  LEAF PATTERN  (01.png)        │
           │                                                      │
           │  left   = تحريك يمين / يسار                        │
           │  top    = تحريك أعلى / أسفل                        │
           │  width  = عرض صورة الأوراق                         │
           │  height = ارتفاع صورة الأوراق                      │
           └──────────────────────────────────────────────────────┘ -->
      <img src="https://a7medka3oud.github.io/email_signature/pattern.png"
           border="0" alt=""
           style="position:absolute;
                  left:0px;
                  top:0px;
                  width:400px;
                  height:200px;
                  display:block;border:0;outline:none;"/>


      <!-- ┌──────────────────────────────────────────────────────┐
           │  🖼️  الإطار الذهبي  –  GOLD FRAME  (02.png)         │
           │                                                      │
           │  left   = تحريك يمين / يسار                        │
           │  top    = تحريك أعلى / أسفل                        │
           │  width  = عرض الإطار                               │
           │  height = ارتفاع الإطار                            │
           └──────────────────────────────────────────────────────┘ -->
      <img src="https://a7medka3oud.github.io/email_signature/framework.png"
           border="0" alt=""
           style="position:absolute;
                  left:2px;
                  top:0px;
                  width:380px;
                  height:200px;
                  display:block;border:0;outline:none;"/>


      <!-- ┌──────────────────────────────────────────────────────┐
           │  🌳  اللوجو  –  LOGO  (04.png)                       │
           │                                                      │
           │  left   = تحريك يمين / يسار                        │
           │  top    = تحريك أعلى / أسفل                        │
           │  width  = عرض اللوجو                               │
           │  height = ارتفاع اللوجو                            │
           └──────────────────────────────────────────────────────┘ -->
      <img src="https://a7medka3oud.github.io/email_signature/logo.png"
           border="0" alt="Awtar Logo"
           style="position:absolute;
                  left:90px;
                  top:40px;
                  width:120px;
                  height:120px;
                  display:block;border:0;outline:none;"/>


      <!-- ┌──────────────────────────────────────────────────────┐
           │  |  الفاصل الذهبي الرأسي  –  GOLD DIVIDER           │
           │                                                      │
           │  left        = تحريك يمين / يسار                   │
           │  top (spacer)= ينزل الفاصل من الأعلى               │
           │  height      = طول الفاصل                          │
           │  bgcolor     = لون الفاصل  (#c7992c = ذهبي)        │
           └──────────────────────────────────────────────────────┘ -->
      <table cellpadding="0" cellspacing="0" border="0"
             style="position:absolute;
                    left:240px;
                    top:0px;">
        <tr>
          <!-- المسافة من الأعلى قبل الفاصل
               height = ينزل الفاصل لأسفل -->
          <td height="28"
              style="font-size:0;line-height:0;height:28px;">
          </td>
        </tr>
        <tr>
          <!-- الفاصل نفسه
               height  = طول الفاصل
               bgcolor = لون الفاصل -->
          <td width="1" height="145"
              bgcolor="#c7992c"
              style="width:1px;height:145px;
                     background-color:#c7992c;
                     font-size:0;line-height:0;">
          </td>
        </tr>
      </table>


      <!-- ┌──────────────────────────────────────────────────────┐
           │  📝  النصوص والبيانات  –  TEXT BLOCK                 │
           │                                                      │
           │  left   = تحريك كل النص يمين / يسار               │
           │  top    = تحريك كل النص أعلى / أسفل               │
           └──────────────────────────────────────────────────────┘ -->
      <table dir="ltr" cellpadding="0" cellspacing="0" border="0"
             style="position:absolute;
                    left:282px;
                    top:18px;
                    direction:ltr;">
        <tr>
          <td style="padding:7px 0 0 0px;">


            <!-- ═══════════════════════════════════════
                 الاسم بالإنجليزي  |  ENGLISH NAME
                 font-size  = حجم الخط
                 color      = لون الخط
                 ═══════════════════════════════════════ -->

               style="margin:0;padding:0;font-size:16px;font-weight:700;line-height:1.2;
                      color:#989998;font-family:Georgia,'Times New Roman',serif;
                      letter-spacing:0.02em;text-align:left;white-space:nowrap;">
              Mahmood Al Dawod
            </p>


            <!-- ═══════════════════════════════════════
                 المسمى الوظيفي بالإنجليزي  |  ENGLISH TITLE
                 font-size  = حجم الخط
                 color      = لون الخط  (#c7992c = ذهبي)
                 ═══════════════════════════════════════ -->
            <p dir="ltr"
               style="margin:4px 0 0 0;padding:0;font-size:10px;font-weight:700;
                      color:#c7992c;font-family:Arial,Helvetica,sans-serif;
                      letter-spacing:0.08em;text-transform:uppercase;
                      text-align:left;white-space:nowrap;">
              Group General Manager
            </p>


            <!-- SPACER -->
            <table cellpadding="0" cellspacing="0" border="0">
              <tr><td height="8" style="font-size:0;line-height:0;height:8px;"></td></tr>
            </table>


            <!-- ═══════════════════════════════════════
                 الاسم بالعربي  |  ARABIC NAME
                 font-size  = حجم الخط
                 color      = لون الخط
                 ═══════════════════════════════════════ -->
            <p dir="rtl"
               style="margin:0;padding:0;font-size:14px;font-weight:700;line-height:1.3;
                      color:#989998;font-family:'Segoe UI',Tahoma,Arial,sans-serif;
                      text-align:left;white-space:nowrap;">
              محمود الداود
            </p>


            <!-- ═══════════════════════════════════════
                 المسمى الوظيفي بالعربي  |  ARABIC TITLE
                 font-size  = حجم الخط
                 color      = لون الخط  (#c7992c = ذهبي)
                 ═══════════════════════════════════════ -->
            <p dir="rtl"
               style="margin:3px 0 0 0;padding:0;font-size:9px;font-weight:700;
                      color:#c7992c;font-family:'Segoe UI',Tahoma,Arial,sans-serif;
                      text-align:left;white-space:nowrap;">
              مدير عام المجموعة
            </p>


            <!-- SPACER -->
            <table cellpadding="0" cellspacing="0" border="0">
              <tr><td height="10" style="font-size:0;line-height:0;height:10px;"></td></tr>
            </table>


            <!-- ═══════════════════════════════════════
                 جدول بيانات التواصل  |  CONTACT TABLE
                 padding-bottom = المسافة بين الصفوف
                 ═══════════════════════════════════════ -->
            <table dir="ltr" cellpadding="0" cellspacing="0" border="0"
                   style="direction:ltr;">


              <!-- ─── رقم الهاتف / واتساب  |  PHONE ─── -->
              <tr>
                <td width="22" valign="middle" align="center"
                    style="width:22px;padding:0 0 2px 0;vertical-align:middle;">
                  <a href="https://api.whatsapp.com/send?phone=966551237974"
                     target="_blank" style="text-decoration:none;border:none;">
                    <img src="phone-icon.png"
                         width="18" height="18" border="0" alt="Phone"
                         style="display:block;border:0;outline:none;width:14px;height:14px;"/>
                  </a>
                </td>
                <td valign="middle" style="padding:0 0 2px 0px;vertical-align:middle;">
                  <a href="https://api.whatsapp.com/send?phone=966551237974"
                     target="_blank"
                     style="text-decoration:none;color:#9B9B9B;font-size:9px;
                            font-weight:600;font-family:Arial,Helvetica,sans-serif;
                            white-space:nowrap;">
                    +966 551 237 974
                  </a>
                </td>
              </tr>


              <!-- ─── الموقع الإلكتروني  |  WEBSITE ─── -->
              <tr>
                <td width="22" valign="middle" align="center"
                    style="width:22px;padding:0 0 7px 0;vertical-align:middle;">
                  <a href="https://www.awtarksa.com/"
                     target="_blank" style="text-decoration:none;border:none;">
                    <img src="global-icon.png"
                         width="18" height="18" border="0" alt="Website"
                         style="display:block;border:0;outline:none;width:14px;height:14px;"/>
                  </a>
                </td>
                <td valign="middle" style="padding:0 0 2px 0px;vertical-align:middle;">
                  <a href="https://www.awtarksa.com/"
                     target="_blank"
                     style="text-decoration:none;color:#9B9B9B;font-size:9px;
                            font-weight:600;font-family:Arial,Helvetica,sans-serif;
                            white-space:nowrap;">
                    www.awtarksa.com
                  </a>
                </td>
              </tr>


              <!-- ─── العنوان  |  LOCATION ─── -->
              <tr>
                <td width="22" valign="middle" align="center"
                    style="width:22px;padding:0;vertical-align:middle;">
                  <a href="https://www.google.com/maps/place/RDLC7445,+7445+Hail,+3664%D8%8C+%D8%AD%D9%8A+%D8%B8%D9%87%D8%B1%D8%A9+%D9%84%D8%A8%D9%86%D8%8C+Riyadh+13784,+Saudi+Arabia"
                     target="_blank" style="text-decoration:none;border:none;">
                    <img src="location-icon.png"
                         width="18" height="18" border="0" alt="Location"
                         style="display:block;border:0;outline:none;width:14px;height:14px;"/>
                  </a>
                </td>
                <td valign="middle" style="padding:0 0 0 0px;vertical-align:middle;">
                  <a href="https://www.google.com/maps/place/RDLC7445,+7445+Hail,+3664%D8%8C+%D8%AD%D9%8A+%D8%B8%D9%87%D8%B1%D8%A9+%D9%84%D8%A8%D9%86%D8%8C+Riyadh+13784,+Saudi+Arabia"
                     target="_blank"
                     style="text-decoration:none;color:#9B9B9B;font-size:9px;
                            font-weight:600;font-family:Arial,Helvetica,sans-serif;
                            white-space:nowrap;">
                    RDLC7445, Riyadh, Saudi Arabia
                  </a>
                </td>
              </tr>


            </table>
            <!-- ═══ END CONTACT TABLE ═══ -->


          </td>
        </tr>
      </table>
      <!-- ═══ END TEXT BLOCK ═══ -->


      <!-- Spacer شفاف يحافظ على ارتفاع الـ td الرئيسي
           width  = نفس عرض السيجنيتشر
           height = نفس ارتفاع السيجنيتشر  -->
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
           width="600" height="200" border="0" alt=""
           style="display:block;visibility:hidden;width:600px;height:200px;"/>


    </td>
    <!-- ╚══ END MAIN BLOCK ══╝ -->

  </tr>
</table>
<!-- ══ END OUTER TABLE ══ -->
